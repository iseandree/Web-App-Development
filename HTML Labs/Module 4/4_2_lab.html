<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4_2 Lab</title>
</head>
<body>
  <h1>Signup</h1>
  <p>Complete the form to sign up for a free account.</p>
   <form method="Post" action="http://www.hashemian.com/tools/form-post-tester.php">
    <label for "firstname">First Name</label>
    <input type="text" name ="firstname">
    <br>
    <br>
    <label for "lastname">Last Name</label>
    <input type="text" name ="lastname">
    <br>
    <br>
    <label for "emailaddress">Email Address</label>
    <input type="email" name ="emailaddress">
    <br>
    <br>
    <label for "birthday">Birthday</label>
    <input type="date" name ="birthday"> 
    <br>
    <br>
    <label for "telephone">Telephone(xxx-xxx-xxxx)</label>
    <input type="tel" name="telephone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
    <br>
    <br>
    <label for "username">User Account Name</label>
    <input type="text" name ="username">
    <br>
    <br>
    <label for "password">Password</label>
    <input type="password" name="password">
    <input type="submit" value="Submit">
</body>
</html>
