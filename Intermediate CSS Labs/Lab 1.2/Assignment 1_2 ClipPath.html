  <style>

    /*Start your Custom CSS Here  */
    .shape{
      clip-path: polygon(75% 0%, 100% 50%, 75% 100%, 0% 100%, 25% 50%, 0% 0%);
    }

    .shape2{
      clip-path: polygon(0% 37%, 100% 0%, 100% 100%, 0% 100%);
    }

    .shape3{
      clip-path: polygon(0 37%, 100% 0, 100% 59%, 0% 100%);
    }
  </style>

</head>

<body>
