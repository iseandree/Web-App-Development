<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="html, training, lessons, templates">
    <meta lang="en-US">
    <link rel="stylesheet" href="style-example-1.css">
    <title>2_4 Lab: Module 2: List and Table Properties</title>
	
	<style>
	
html, body{
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
}

div {
  padding: 1.0em;
}

h1 {
  text-align: center;
  padding-top: 1.5em;
  padding-bottom: 0.5em;
}




	
	</style>
    
</head>

<body>
    <h1>Grocery List</h1>
    <div>
        <table class="tableStriped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Item</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Almond Milk</td>
                    <td class="out"></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Eggs</td>
                    <td class="low"></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Ground Turkey</td>
                    <td class="plenty"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <h1>Family Members</h1>
    <div>
        <ul class="listClass">
            <li>David</li>
            <li>Pam</li>
            <li>Jonathan</li>
            <li>Denise</li>
        </ul>
    </div>
</body>

</html>
